name: Build

# Builds Mural for Linux, macOS and Windows on every push and pull request.
# Pushing a tag like v0.1.0 also publishes the binaries and the source archive as a GitHub release
# (Mural is GPL-3.0-or-later, so the source always ships with the binaries).

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in step with the dioxus version in Cargo.lock.
  DIOXUS_CLI_VERSION: 0.7.10

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-pulseaudio
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build AppImage
        run: ./scripts/build-linux-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Install Dioxus CLI
        run: cargo binstall --no-confirm --force "dioxus-cli@${DIOXUS_CLI_VERSION}"
      # .cargo/config.toml links the static C runtime, matching sherpa-onnx's /MT libraries.
      - name: Test
        run: cargo test --locked
      # NSIS installer (per-user, no admin rights). The bundler downloads NSIS itself; the licence
      # page shows the GPL, and the notices are installed next to Mural.exe.
      - name: Build installer
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ./scripts/rust-licenses.sh
          dx bundle --release --package-types nsis --out-dir target/installer
          mkdir -p dist
          INSTALLER=$(find target/installer -name '*-setup.exe' | head -1)
          test -n "$INSTALLER"
          cp "$INSTALLER" "dist/Mural-$VERSION-x86_64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*-setup.exe
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Install Dioxus CLI
        run: cargo binstall --no-confirm --force "dioxus-cli@${DIOXUS_CLI_VERSION}"
      - name: Test
        run: cargo test --locked
      # Signs ad-hoc, so no Apple certificate is needed (see scripts/build-macos.sh for Developer ID signing).
      - name: Build app and disk image
        run: ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  source:
    name: Source archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Archive
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist
          git archive --format=tar.gz --prefix="mural-desktop-$VERSION/" \
            -o "dist/Mural-$VERSION-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
